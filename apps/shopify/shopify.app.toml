# Shopify-side config for ChatDaddy for Shopify (the app in Shopify's Dev Dashboard).
# Linked with `shopify app config link`; push changes with `shopify app deploy`.
# Merchants start in ChatDaddy, not in Shopify, so the app is not embedded (S-6 decides that later).
client_id = "8c91c9545eed6c5ba4d152d4f692c93f"
name = "ChatDaddy"
application_url = "https://www.beta.chatdaddy.tech/apps"
embedded = false

[access_scopes]
# must match `connections[0].scopes` in chatdaddy-app.json
scopes = "read_customers,read_fulfillments,read_orders,write_orders"

[auth]
# the ChatDaddy dashboard callback; bots' OAUTH_REDIRECT_URI must be this exact URL
redirect_urls = ["https://www.beta.chatdaddy.tech/apps/connect/callback"]

[webhooks]
api_version = "2027-01"

  # GDPR topics are app-level and handled by bots (P5 A-7, bots #394). Per-shop order/customer
  # webhooks are registered by the app itself on `connected`, so none are listed here.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://api.chatdaddy.tech/bots/apps/chatdaddy-shopify/compliance/shopify"

[pos]
embedded = false

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false
