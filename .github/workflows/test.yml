name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite:
          - packages/create-chatdaddy-app
          - packages/create-chatdaddy-app/template
          - examples/shopify-order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # every suite is dependency-free: no install step
      - name: Test ${{ matrix.suite }}
        working-directory: ${{ matrix.suite }}
        run: node --test test/*.test.mjs
